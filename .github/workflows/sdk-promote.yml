name: Promote to production

# Phase three of the SDK promotion pipeline: every push to this staging
# repo's main rolls into a single sync branch + PR on the production repo.
# A human merges that PR to release; release-please on the production repo
# derives the version bump and changelog from the sync commit's
# conventional-commit lines and opens its version PR, and the publish
# workflow ships the release when that merges.
#
# The sync branch is built as production/main plus ONE commit whose tree is
# exactly staging main (not staging's commit history) — squash-merge safe,
# and the PR diff always equals "what changes in production". The commit's
# title is the first conventional staging subject since the last sync and
# its body carries the rest, each as its own paragraph, which release-please
# parses as separate changelog entries. A Staging-Sha footer records the
# synced staging commit so the next run knows its range.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sdk-promote
  cancel-in-progress: true

env:
  PRODUCTION_REPO: cadenya/cadenya-go
  SYNC_BRANCH: staging-sync

jobs:
  promote:
    # Guard against this file running after it syncs into the production repo.
    if: github.repository == 'cadenya/cadenya-go-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build tree-sync commit and open the rolling PR
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::PRODUCTION_REPO_TOKEN is not configured on this repo — skipping promotion."
            exit 0
          fi
          git config user.name "diddlysquat-promote"
          git config user.email "diddlysquat-promote@users.noreply.github.com"
          git remote add production "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git -c "http.https://github.com/.extraheader=" fetch production main

          if git diff --quiet production/main origin/main; then
            echo "Production already matches staging's tree — nothing to promote."
            exit 0
          fi

          # Range since the last sync, recovered from the previous sync
          # commit's Staging-Sha footer; first sync falls back to the last
          # 15 staging commits.
          prev=$(git log production/main --grep '^Staging-Sha: ' -1 --format=%B 2>/dev/null | sed -n 's/^Staging-Sha: \([0-9a-f]\{40\}\)$/\1/p' | head -1)
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            subjects=$(git log --format=%s --no-merges "$prev..origin/main")
          else
            subjects=$(git log --format=%s --no-merges -15 origin/main)
          fi
          conventional=$(printf '%s\n' "$subjects" | grep -E '^(feat|fix|perf|refactor|docs|chore|build|ci|test|style)(\([^)]*\))?!?: ' || true)
          title=$(printf '%s\n' "$conventional" | head -1)
          [ -n "$title" ] || title="chore: sync from staging"

          git checkout --detach production/main
          git read-tree -u --reset origin/main
          {
            echo "$title"
            # Remaining conventional subjects as their own paragraphs —
            # release-please parses each as an additional changelog entry.
            printf '%s\n' "$conventional" | tail -n +2 | while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo
              echo "$line"
            done
            echo
            echo "Staging-Sha: $(git rev-parse origin/main)"
          } > /tmp/sync-msg
          git commit -qF /tmp/sync-msg
          git -c "http.https://github.com/.extraheader=" push --force production "HEAD:refs/heads/${SYNC_BRANCH}"

          {
            echo "Rolling sync of \`${{ github.repository }}\` main into production, rebuilt on every staging push as a single tree-sync commit on top of production main (safe to squash-merge — release-please reads the commit's conventional lines for the version bump and changelog)."
            echo
            echo "Staging commits in this sync:"
            printf '%s\n' "$subjects" | sed 's/^/- /'
          } > /tmp/pr-body
          existing=$(gh pr list --repo "$PRODUCTION_REPO" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ]; then
            gh pr edit "$existing" --repo "$PRODUCTION_REPO" --body-file /tmp/pr-body
            echo "Rolling sync PR #$existing rebuilt and body updated."
          else
            gh pr create --repo "$PRODUCTION_REPO" --base main --head "$SYNC_BRANCH" \
              --title "Sync from staging" --body-file /tmp/pr-body
          fi
